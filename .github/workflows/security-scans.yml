name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  security-scan-frontend:
    uses: test-self-org/.github/.github/workflows/security-scans.yml@main
    with:
      folder: ./architecture-project-frontend
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-scan-backend:
    uses: test-self-org/.github/.github/workflows/security-scans.yml@main
    with:
      folder: ./architecture-project-backend
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}